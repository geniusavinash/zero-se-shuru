# Daily refresh of Zero Se Shuru (ARCHITECTURE §11).
# Secrets (Settings > Secrets and variables > Actions): AZURE_OPENAI_API_KEY (Azure Key 2), AZURE_OPENAI_BASE_URL,
# ADZUNA_APP_ID, ADZUNA_APP_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
# and CONTACT_EMAIL (optional).
name: refresh

on:
  schedule:
    - cron: "37 0 * * *"  # 06:07 IST
    - cron: "37 13 * * *" # 19:07 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No new LLM calls and no minimum count: proves the deploy path"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Production is built only from main (review fix): a run started on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No stored git credentials: npm packages and the refresh code cannot push (review fix, round 2).
      # Only the "Commit data" step gets the token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm install, not npm ci: the lockfile was written on Windows and lacks two Linux-only optional
      # packages (@emnapi/*), which npm ci refuses (first Actions run, 2026-11-20). The lockfile change on
      # the runner is undone so the data commit stays clean.
      - run: npm install --no-audit --no-fund && git checkout -- package-lock.json

      - name: Refresh
        id: refresh
        continue-on-error: true
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run refresh

      # The run record and the call log are committed even when the run was blocked: git is the history.
      # A dry run commits nothing.
      - name: Commit data
        if: always() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: refresh $(date -u -d '+5 hours 30 minutes' +%F) (${{ github.event_name }})"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main

      # Only a successful refresh is deployed; otherwise yesterday's page stays up.
      # A dry run (no minimum count) goes to the preview branch, never to production (review fix).
      - name: Deploy to Cloudflare Pages
        if: steps.refresh.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy site --project-name=zero-se-shuru --branch=${{ inputs.dry_run == true && 'preview' || 'main' }} --commit-dirty=true

      - name: Mark the run failed when the refresh did not succeed
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::The refresh did not succeed; nothing was deployed. See the Refresh step."
          exit 1
