# The one list of roles and cities (reused from v1; 17 roles in v2). The prompt, the schema, the location
# rule, the page filters and the evaluation all read this file. Ids never change once the 50 are drawn.

roles:
  - id: software_development
    name: Software development
    kind: technical
    definition: Builds software, web, backend, frontend, mobile, full stack.
    examples: [SDE Intern, React Developer]
  - id: data_analytics_ai
    name: Data, analytics and AI
    kind: technical
    definition: Analyses data or builds data, ML or GenAI systems.
    examples: [Data Analyst, ML Engineer Intern]
  - id: qa_testing
    name: QA and testing
    kind: technical
    definition: Tests software, manual or automated.
    examples: [QA Engineer, SDET]
  - id: it_cloud_security
    name: IT, cloud and security
    kind: technical
    definition: "Runs systems: DevOps, cloud, networks, IT helpdesk, security."
    examples: [DevOps Engineer, SOC Analyst]
  - id: non_software_engineering
    name: Engineering (non-software)
    kind: technical
    definition: Mechanical, electrical, electronics, civil, chemical, embedded, VLSI, architecture.
    examples: ["Graduate Engineer Trainee (Mechanical)", Embedded Engineer]
  - id: design_creative
    name: Design and creative
    kind: non_technical
    definition: Visual and experience design, video, animation.
    examples: [UI/UX Designer, Video Editor]
  - id: product_project
    name: Product and project
    kind: non_technical
    definition: Product, programme or project coordination.
    examples: [Product Analyst, Project Coordinator]
  - id: marketing
    name: Marketing
    kind: non_technical
    definition: Brand, digital, social, SEO, performance, PR.
    examples: [Digital Marketing Intern, SEO Executive]
  - id: content_writing
    name: Content and writing
    kind: non_technical
    definition: Writes or edits text.
    examples: [Content Writer, Technical Writer]
  - id: sales_bd
    name: Sales and business development
    kind: non_technical
    definition: Sells or generates leads against targets.
    examples: [Business Development Executive, Inside Sales]
  - id: customer_support
    name: Customer support
    kind: non_technical
    definition: Serves existing customers, by voice or chat.
    examples: [Customer Support Executive, Customer Success Associate]
  - id: operations_admin
    name: Operations and admin
    kind: non_technical
    definition: "Runs day-to-day processes: operations, logistics, procurement, back office."
    examples: [Operations Executive, Supply Chain Trainee]
  - id: finance_accounting
    name: Finance and accounting
    kind: non_technical
    definition: Accounting, audit, tax, banking, financial analysis.
    examples: [Accounts Executive, Article Assistant]
  - id: hr_recruitment
    name: HR and recruitment
    kind: non_technical
    definition: Hiring and people operations.
    examples: [HR Intern, Talent Acquisition Associate]
  - id: education_research
    name: Education and research
    kind: non_technical
    definition: Teaching, training, academic content, university or lab assistants.
    examples: [Subject Matter Expert, Research Assistant]
  - id: legal_compliance
    name: Legal and compliance
    kind: non_technical
    definition: Law, contracts, compliance, company secretarial.
    examples: [Legal Intern, Compliance Analyst]
  - id: other
    name: Other
    kind: none
    definition: The role fits none of the above, or the text is too thin to decide.
    examples: []

tie_breaks:
  - Judge by the work, not the employer's industry. Title first; a specific description wins over a vague title.
  - Business Analyst is data_analytics_ai unless the work is requirements and coordination, then product_project.
  - Targets and leads mean sales_bd; campaigns and SEO mean marketing; edtech counsellor roles are sales_bd.
  - Customer-facing technical support is customer_support; internal helpdesk and cloud support are it_cloud_security.
  - A UI developer who codes is software_development; a UI/UX designer is design_creative.
  - ML or data work is data_analytics_ai; building product features that call an AI API is software_development.
  - Embedded, firmware and VLSI are non_software_engineering. A software role on a team called "core" is still software_development.
  - "Research takes its field: ML research is data_analytics_ai, market research is marketing."
  - Strategy, consulting, founder's office and trainee posts with no stated function are other.
  - A post listing several roles takes the first or most emphasised one.

